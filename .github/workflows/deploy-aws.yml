name: Deploy AWS

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    timeout-minutes: 60

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Prepare SSH
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -T 10 -H "$AWS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$AWS_USER@$AWS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          PROJECT_DIR=/home/ubuntu/ddokbot/one-cycle_api
          cd "$PROJECT_DIR"

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Deployment stopped: tracked files have uncommitted changes."
            git status -sb
            exit 1
          fi

          git fetch origin main
          git switch main
          git pull --ff-only origin main

          COMPOSE=(
            docker compose
            --env-file .env
            -f infra/docker-compose.yml
            --profile ai
          )

          "${COMPOSE[@]}" build \
            nginx \
            backend \
            crawler \
            document-worker \
            rag

          "${COMPOSE[@]}" run --rm --no-deps -T \
            backend alembic upgrade head </dev/null

          echo "Database migration completed"

          "${COMPOSE[@]}" up -d --no-deps \
            nginx \
            backend \
            crawler \
            scheduler \
            document-worker \
            rag

          # Reload the new Backend container address.
          "${COMPOSE[@]}" restart nginx

          check_url() {
            local name="$1"
            local url="$2"

            for attempt in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                echo "$name health check succeeded"
                return 0
              fi

              echo "$name waiting: $attempt/30"
              sleep 5
            done

            echo "$name health check failed"
            return 1
          }

          check_url "Backend" \
            "http://127.0.0.1:18000/api/health"

          check_url "Database" \
            "http://127.0.0.1:18000/api/health/db"

          check_url "Crawler" \
            "http://127.0.0.1:18004/health"

          check_url "Document Worker" \
            "http://127.0.0.1:18003/openapi.json"

          check_url "RAG" \
            "http://127.0.0.1:18002/health"

          check_url "Public API" \
            "https://ddokbot-api.hwanmade.store/api/health"

          check_url "User API Proxy" \
            "https://ddokbot.codefoilo.store/api/health"

          check_url "Admin API Proxy" \
            "https://ddokbot.admin.codefoilo.store/api/health"

          "${COMPOSE[@]}" ps
          git log -1 --oneline
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519