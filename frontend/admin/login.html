<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 로그인</title><link rel="stylesheet" href="./css/common.css"><link rel="stylesheet" href="./css/login.css"></head><body><main class="login-page"><section class="login-visual"><div class="visual-inner"><div class="visual-logo"><span>LH</span><span>공고 AI 도우미</span></div><h1>관리자 시스템에<br>로그인하세요.</h1><p>공고 수집, 문서 처리 및 오류 현황을 한곳에서 안전하게 관리할 수 있습니다.</p></div></section><section class="login-area"><div class="login-box"><h2>관리자 로그인</h2><p>관리자 계정으로 로그인해 주세요.</p><form id="loginForm"><div class="field"><label for="adminId">아이디</label><input class="input login-input" id="adminId" name="adminId" autocomplete="username" placeholder="아이디를 입력하세요"></div><div class="field"><label for="password">비밀번호</label><div class="password-wrap"><input class="input login-input" id="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요"><button type="button" id="togglePassword">보기</button></div></div><div class="login-error" id="loginError"></div><button class="btn btn-primary login-submit" id="loginButton">로그인</button></form><div class="login-help"><b>관리자 인증</b><br>FastAPI의 관리자 로그인 API와 연결됩니다.<br>계정 정보는 서버 설정 또는 관리자 DB 기준을 사용합니다.</div></div></section></main><script type="module" src="./js/login.js"></script></body></html>
