name: one-cycle

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    container_name: one-cycle-postgres
    restart: unless-stopped

    env_file:
      - ../.env

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile

    image: one-cycle-backend:dev
    container_name: one-cycle-backend
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      APP_ENVIRONMENT: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RAG_SERVICE_BASE_URL: http://rag:18002
      DOCUMENT_WORKER_BASE_URL: http://document-worker:18003
      CRAWLER_STAGING_DIR: /data/documents

    volumes:
      - "${DOCUMENT_STORAGE_HOST_PATH:-../runtime/documents}:/data/documents"

    ports:
      - "127.0.0.1:18000:18000"

    depends_on:
      postgres:
        condition: service_healthy

  document-worker:
    build:
      context: ..
      dockerfile: infra/document-worker/Dockerfile

    image: one-cycle-document-worker:dev
    container_name: one-cycle-document-worker
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      EMBEDDING_SERVICE_URL: http://embedding:18001

    volumes:
      - "${DOCUMENT_STORAGE_HOST_PATH:-../runtime/documents}:/data/documents"

    ports:
      - "127.0.0.1:18003:18003"

volumes:
  postgres_data:
    name: one-cycle-postgres-data
